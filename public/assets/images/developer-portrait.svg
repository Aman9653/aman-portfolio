  <!-- features -->
  <path d="M254 366v22c0 6 4 10 10 10" stroke="#C98F66" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M232 412c18 14 42 14 60 0" stroke="#B9825E" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- accents -->
  <g fill="#22D3EE" opacity="0.7">
    <circle cx="88" cy="176" r="5"/>
    <circle cx="430" cy="140" r="4"/>
  </g>
  <g fill="#A78BFA" opacity="0.7">
    <circle cx="440" cy="330" r="5"/>
    <circle cx="70" cy="332" r="4"/>
  </g>
